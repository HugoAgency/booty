version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: tbr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-booty_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-booty_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - tbr_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tbr_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@db:5432/${POSTGRES_DB:-booty_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-tbr_super_secure_jwt_secret_key_2026_booty_republic}
      ADMIN_DEFAULT_USERNAME: ${ADMIN_DEFAULT_USERNAME:-admin}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?ADMIN_DEFAULT_PASSWORD is required}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    networks:
      - tbr_network

volumes:
  postgres_data:
    name: tbr_postgres_data

networks:
  tbr_network:
    name: tbr_network
    driver: bridge
